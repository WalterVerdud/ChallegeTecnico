name: Playwright Automation

on:
  push:
  pull_request:

jobs:

  api-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Parte 1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        with:
          name: parte1-report
          path: Parte 1/playwright-report

  ui-tests:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Parte 2

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps

      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        with:
          name: parte2-report
          path: Parte 2/playwright-report